<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1660" viewBox="0 0 1500 1660" role="img" aria-labelledby="title desc">
  <title id="title">Sequence Diagram LMS Assignment</title>
  <desc id="desc">Urutan interaksi Lecturer, LMS, dan Student dalam proses assignment.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="lms" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowDark" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#334155"/></marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#6366f1"/></marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#059669"/></marker>
    <style>
      .font { font-family: Inter, Arial, sans-serif; }
      .title { font-size: 32px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 16px; fill: #64748b; }
      .participant { font-size: 20px; font-weight: 700; }
      .message { font-size: 15px; font-weight: 600; fill: #1e293b; }
      .return { font-size: 14px; fill: #475569; }
      .section { font-size: 14px; font-weight: 700; letter-spacing: 1px; }
      .note-title { font-size: 14px; font-weight: 700; }
      .note { font-size: 13px; fill: #475569; }
      .num { font-size: 12px; font-weight: 700; fill: white; }
    </style>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#b45309"/></marker>
  </defs>

  <rect width="1500" height="1660" fill="url(#bg)"/>
  <g class="font">
    <text x="750" y="58" text-anchor="middle" class="title">Sequence Diagram — LMS Assignment</text>
    <text x="750" y="87" text-anchor="middle" class="subtitle">Dari pembuatan tugas hingga student menerima nilai dan feedback</text>

    <!-- Participant heads -->
    <g filter="url(#shadow)"><rect x="110" y="126" width="260" height="88" rx="20" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/></g>
    <circle cx="157" cy="170" r="24" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <circle cx="157" cy="162" r="7" fill="#6366f1"/><path d="M143 186 Q157 171 171 186" fill="#6366f1"/>
    <text x="205" y="176" class="participant" fill="#4338ca">Lecturer</text>

    <g filter="url(#shadow)"><rect x="620" y="126" width="260" height="88" rx="20" fill="url(#lms)"/></g>
    <rect x="660" y="148" width="48" height="41" rx="7" fill="#ffffff" fill-opacity="0.22" stroke="white"/>
    <rect x="669" y="157" width="30" height="5" rx="2.5" fill="white"/><rect x="669" y="168" width="23" height="5" rx="2.5" fill="#c7d2fe"/>
    <text x="730" y="176" class="participant" fill="white">LMS</text>

    <g filter="url(#shadow)"><rect x="1130" y="126" width="260" height="88" rx="20" fill="#ffffff" stroke="#a7f3d0" stroke-width="2"/></g>
    <circle cx="1177" cy="170" r="24" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <circle cx="1177" cy="162" r="7" fill="#059669"/><path d="M1163 186 Q1177 171 1191 186" fill="#059669"/>
    <text x="1225" y="176" class="participant" fill="#047857">Student</text>

    <!-- Lifelines -->
    <line x1="240" y1="214" x2="240" y2="1540" stroke="#818cf8" stroke-width="2" stroke-dasharray="8 8"/>
    <line x1="750" y1="214" x2="750" y2="1540" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="8 8"/>
    <line x1="1260" y1="214" x2="1260" y2="1540" stroke="#34d399" stroke-width="2" stroke-dasharray="8 8"/>

    <!-- Section 1 -->
    <rect x="74" y="250" width="1352" height="38" rx="10" fill="#e0e7ff"/>
    <text x="96" y="275" class="section" fill="#4338ca">A. PEMBUATAN DAN PUBLIKASI ASSIGNMENT</text>

    <!-- 1 -->
    <line x1="250" y1="333" x2="739" y2="333" stroke="#334155" stroke-width="2.5" marker-end="url(#arrowDark)"/>
    <text x="494" y="320" text-anchor="middle" class="message">Login dan buka menu Assignment</text>
    <rect x="739" y="320" width="22" height="56" rx="5" fill="#c4b5fd" stroke="#7c3aed"/>

    <line x1="739" y1="390" x2="251" y2="390" stroke="#6366f1" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowPurple)"/>
    <text x="495" y="381" text-anchor="middle" class="return">Tampilkan formulir assignment</text>

    <!-- 2 -->
    <line x1="250" y1="450" x2="739" y2="450" stroke="#334155" stroke-width="2.5" marker-end="url(#arrowDark)"/>
    <text x="494" y="437" text-anchor="middle" class="message">Isi judul, instruksi, deadline, dan lampiran</text>
    <rect x="739" y="437" width="22" height="62" rx="5" fill="#c4b5fd" stroke="#7c3aed"/>

    <!-- 3 -->
    <line x1="250" y1="525" x2="739" y2="525" stroke="#334155" stroke-width="2.5" marker-end="url(#arrowDark)"/>
    <text x="494" y="512" text-anchor="middle" class="message">Publikasikan assignment</text>
    <rect x="739" y="512" width="22" height="80" rx="5" fill="#c4b5fd" stroke="#7c3aed"/>

    <line x1="761" y1="560" x2="1249" y2="560" stroke="#059669" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
    <text x="1005" y="547" text-anchor="middle" class="message">Notifikasi assignment baru</text>
    <rect x="1249" y="548" width="22" height="44" rx="5" fill="#a7f3d0" stroke="#059669"/>

    <!-- Section 2 -->
    <rect x="74" y="625" width="1352" height="38" rx="10" fill="#d1fae5"/>
    <text x="96" y="650" class="section" fill="#047857">B. PENGERJAAN DAN PENGUMPULAN TUGAS</text>

    <!-- 4 -->
    <line x1="1250" y1="708" x2="761" y2="708" stroke="#334155" stroke-width="2.5" marker-end="url(#arrowDark)"/>
    <text x="1005" y="695" text-anchor="middle" class="message">Buka detail assignment</text>
    <rect x="739" y="695" width="22" height="68" rx="5" fill="#c4b5fd" stroke="#7c3aed"/>
    <line x1="739" y1="778" x2="1271" y2="778" stroke="#059669" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGreen)"/>
    <text x="1005" y="769" text-anchor="middle" class="return">Tampilkan instruksi dan deadline</text>

    <!-- 5 -->
    <line x1="1250" y1="838" x2="761" y2="838" stroke="#334155" stroke-width="2.5" marker-end="url(#arrowDark)"/>
    <text x="1005" y="825" text-anchor="middle" class="message">Unggah jawaban / file submission</text>
    <rect x="739" y="825" width="22" height="103" rx="5" fill="#c4b5fd" stroke="#7c3aed"/>

    <path d="M761 866 H818 V904 H761" fill="none" stroke="#7c3aed" stroke-width="2.3" marker-end="url(#arrowPurple)"/>
    <text x="835" y="890" class="message">Validasi format file dan deadline</text>

    <!-- Alt box -->
    <rect x="205" y="950" width="1200" height="212" rx="10" fill="#ffffff" fill-opacity="0.35" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M205 950 H300 L322 972 H205 Z" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="226" y="968" class="note-title" fill="#334155">ALT</text>
    <text x="340" y="968" class="note-title" fill="#047857">[Submission valid]</text>
    <line x1="761" y1="1015" x2="1249" y2="1015" stroke="#059669" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGreen)"/>
    <text x="1005" y="1006" text-anchor="middle" class="return">Submission berhasil disimpan</text>
    <line x1="739" y1="1070" x2="251" y2="1070" stroke="#6366f1" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowPurple)"/>
    <text x="495" y="1061" text-anchor="middle" class="return">Notifikasi submission baru</text>
    <line x1="205" y1="1100" x2="1405" y2="1100" stroke="#94a3b8" stroke-dasharray="6 5"/>
    <text x="226" y="1124" class="note-title" fill="#b45309">[Tidak valid / melewati deadline]</text>
    <line x1="761" y1="1142" x2="1249" y2="1142" stroke="#b45309" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowAmber)"/>
    <text x="1005" y="1133" text-anchor="middle" class="return">Submission ditolak / ditandai terlambat</text>

    <!-- Section 3 -->
    <rect x="74" y="1185" width="1352" height="38" rx="10" fill="#ede9fe"/>
    <text x="96" y="1210" class="section" fill="#6d28d9">C. PENILAIAN DAN FEEDBACK</text>

    <!-- 6 -->
    <line x1="250" y1="1268" x2="739" y2="1268" stroke="#334155" stroke-width="2.5" marker-end="url(#arrowDark)"/>
    <text x="494" y="1255" text-anchor="middle" class="message">Buka dan periksa submission</text>
    <rect x="739" y="1255" width="22" height="58" rx="5" fill="#c4b5fd" stroke="#7c3aed"/>

    <!-- 7 -->
    <line x1="250" y1="1348" x2="739" y2="1348" stroke="#334155" stroke-width="2.5" marker-end="url(#arrowDark)"/>
    <text x="494" y="1335" text-anchor="middle" class="message">Masukkan nilai dan feedback</text>
    <rect x="739" y="1335" width="22" height="92" rx="5" fill="#c4b5fd" stroke="#7c3aed"/>

    <line x1="761" y1="1390" x2="1249" y2="1390" stroke="#059669" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
    <text x="1005" y="1377" text-anchor="middle" class="message">Notifikasi nilai tersedia</text>

    <!-- 8 -->
    <line x1="1250" y1="1470" x2="761" y2="1470" stroke="#334155" stroke-width="2.5" marker-end="url(#arrowDark)"/>
    <text x="1005" y="1457" text-anchor="middle" class="message">Buka hasil penilaian</text>
    <rect x="739" y="1457" width="22" height="70" rx="5" fill="#c4b5fd" stroke="#7c3aed"/>
    <line x1="739" y1="1542" x2="1271" y2="1542" stroke="#059669" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGreen)"/>
    <text x="1005" y="1533" text-anchor="middle" class="return">Tampilkan nilai dan feedback</text>

    <!-- Footer legend -->
    <rect x="300" y="1590" width="900" height="42" rx="21" fill="#ffffff" stroke="#e2e8f0"/>
    <line x1="350" y1="1611" x2="405" y2="1611" stroke="#334155" stroke-width="2.5" marker-end="url(#arrowDark)"/>
    <text x="420" y="1616" class="note">Permintaan / aksi</text>
    <line x1="620" y1="1611" x2="675" y2="1611" stroke="#059669" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGreen)"/>
    <text x="690" y="1616" class="note">Respons / notifikasi</text>
    <rect x="925" y="1599" width="18" height="25" rx="4" fill="#c4b5fd" stroke="#7c3aed"/>
    <text x="957" y="1616" class="note">Aktivasi proses LMS</text>
    <circle cx="283" cy="333" r="14" fill="#6366f1"/><text x="283" y="337" text-anchor="middle" class="num">1</text>
    <circle cx="283" cy="450" r="14" fill="#6366f1"/><text x="283" y="454" text-anchor="middle" class="num">2</text>
    <circle cx="283" cy="525" r="14" fill="#6366f1"/><text x="283" y="529" text-anchor="middle" class="num">3</text>
    <circle cx="1217" cy="708" r="14" fill="#059669"/><text x="1217" y="712" text-anchor="middle" class="num">4</text>
    <circle cx="1217" cy="838" r="14" fill="#059669"/><text x="1217" y="842" text-anchor="middle" class="num">5</text>
    <circle cx="283" cy="1268" r="14" fill="#6366f1"/><text x="283" y="1272" text-anchor="middle" class="num">6</text>
    <circle cx="283" cy="1348" r="14" fill="#6366f1"/><text x="283" y="1352" text-anchor="middle" class="num">7</text>
    <circle cx="1217" cy="1470" r="14" fill="#059669"/><text x="1217" y="1474" text-anchor="middle" class="num">8</text>
  </g>
</svg>
