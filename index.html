<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AYVETO Access Process</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0d1620; overflow: hidden; }
    canvas { display: block; margin: 0 auto; }
  </style>
  <script type="importmap">
    { "imports": { "three": "./node_modules/three/build/three.module.js" } }
  </script>
</head>
<body>
  <script type="module">
    // ?scene=scene_gempa loads the earthquake version; default is the fire evacuation (scene.js)
    const name = new URLSearchParams(location.search).get('scene') || 'scene';
    if (!/^[a-z_]+$/.test(name)) throw new Error('bad scene name');
    import(`./${name}.js`);
  </script>
</body>
</html>
